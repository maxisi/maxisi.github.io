# Public gists (single-file Jupyter notebooks) turned into notes by
# bin/import_gists.py, which writes _posts/<date>-<slug>.md, saves the notebook
# under assets/notebooks/ and its figures under assets/img/notes/<slug>/.
#
# Format (kept deliberately simple: the importer parses it without PyYAML):
#   - a flat list; each entry starts with "- id:" and continues with indented
#     "key: value" lines;
#   - values are plain scalars (optionally in single or double quotes) except
#     "tags", which is an inline list like [noise, waveforms];
#   - no nesting, no multi-line values, no anchors; "#" starts a comment.
#
# Keys
#   id           gist id (https://gist.github.com/maxisi/<id>)
#   slug         URL slug and basename for the post, notebook and figures
#   title        post title, sentence case
#   date         post date (gist creation date), YYYY-MM-DD
#   tags         1-3 of: data-access, noise, waveforms, hierarchical-inference,
#                parameter-estimation, populations, ringdown, gpu
#   description  one plain sentence, shown in the notes index

