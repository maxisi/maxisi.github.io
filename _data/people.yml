# People shown on /group/ and in the group strip on the home page.
#
# Each member has:
#   id        short slug, used for anchors (#id) and cross-references from _research/*.md
#   name      display name
#   role      one of the `key`s under `roles` below (sections on the group page, in this order)
#   title     one line shown under the name (position and institution)
#   start     year they joined (optional; shown as "2025–" while current)
#   photo     file in assets/img/people/ (optional; a placeholder with initials is used otherwise)
#   blurb     one sentence on what they work on (optional)
#   research  list of research-area slugs from _research/ (optional; adds them to the area's "People")
#   links     any of website, github, orcid, email, scholar, linkedin (optional)
#
# Alumni go under `alumni` with `end` and `now` (current position) once known.

roles:
  - key: pi
    title: Principal investigator
  - key: postdoc
    title: Postdoctoral researchers
  - key: phd
    title: Graduate students
  - key: undergrad
    title: Undergraduate students

