- title: Software
  type: time_table
  contents:
    - title: "<a href='https://github.com/maxisi/ringdown'>ringdown</a>"
      maindescription: "Python package for analyzing black-hole ringdowns in gravitational-wave data using Hamiltonian Monte Carlo (<a href='https://pypi.org/project/ringdown'>PyPI</a>)."
    - title: "<a href='https://github.com/kazewong/jim'>jim</a>"
      maindescription: "Accelerated and robust parameter estimation for gravitational waves using a JAX-based sampler (<a href='https://pypi.org/project/jimGW'>PyPI</a>)."
    - title: "<a href='https://github.com/maxisi/gwaxion'>GWaxion</a>"
      maindescription: "Python package for computations related to gravitational-wave emission by ultralight bosons, a dark-matter candidate (<a href='https://pypi.org/project/gwaxion'>PyPI</a>)."
    - title: "<a href='https://git.ligo.org/max-isi/pulsarutils'>pulsarutils</a>"
      maindescription: "Python-based Bayesian inference pipeline for testing general relativity with continuous gravitational waves."
    - title: Other contributions
      maindescription: "LIGO–Virgo data-analysis code in Python and C++, including <a href='https://git.ligo.org/lscsoft/lalsuite'>LALSuite</a> and <a href='https://github.com/gwpy'>GWpy</a>. See also the <a href='/software/'>software page</a>."

- title: Publications
  type: grouped
  contents:
    - title: Short-author-list publications
      type: include
      include: cv/publications_summary.html
    - title: Collaboration publications led or with key contributions
      text: >
        I am an author on the LIGO–Virgo–KAGRA Collaboration articles listed on
        <a href='https://inspirehep.net/literature?sort=mostrecent&size=25&page=1&q=author%3Aisi%20%2B%20reitze'>INSPIRE</a>.
        Out of those, I have led or made key contributions to the following:
      type: dated_list
      contents:
        - year: 2026
          title: "GWTC-5.0: Population Properties of Merging Compact Binaries"
          url: https://arxiv.org/abs/2605.27226
          meta: LIGO–Virgo–KAGRA Collaboration
          note: I co-wrote the manuscript and led the analysis that revealed a subpopulation of high-spin black holes.
        - year: 2025
          title: "GW250114: Testing Hawking's Area Law and the Kerr Nature of Black Holes"
          url: https://arxiv.org/abs/2509.08054
          meta: LIGO–Virgo–KAGRA Collaboration, <em>Phys. Rev. Lett.</em> 135, 111403
          note: I chaired the writing team and led the flagship analyses, which relied on techniques I established.
        - year: 2025
          title: "GW231123: a Binary Black Hole Merger with Total Mass 190–265 solar masses"
          url: https://arxiv.org/abs/2507.08219
          meta: LIGO–Virgo–KAGRA Collaboration
          note: I contributed to the ringdown and systematics analyses.
        - year: 2021
          title: Tests of General Relativity with GWTC-3
          url: https://arxiv.org/abs/2112.06861
          meta: LIGO–Virgo–KAGRA Collaboration, <em>Phys. Rev. D</em>
          note: I contributed the methodology for combining observations from multiple events.
        - year: 2021
          title: Tests of general relativity with binary black holes from the second LIGO–Virgo gravitational-wave transient catalog
          url: https://arxiv.org/abs/2010.14529
          meta: LIGO–Virgo Collaboration, <em>Phys. Rev. D</em> 103, 122002
          note: "I chaired this paper: orchestrated the results and led the writing."
        - year: 2020
          title: "GW190521: A Binary Black Hole Merger with a Total Mass of 150 solar masses"
          url: https://arxiv.org/abs/2009.01075
          meta: LIGO–Virgo Collaboration, <em>Phys. Rev. Lett.</em> 125, 101102
          note: I carried out the preferred parameter estimation for this source and contributed waveform systematics studies.
        - year: 2020
          title: Properties and Astrophysical Implications of the 150 solar-mass Binary Black Hole Merger GW190521
          url: https://arxiv.org/abs/2009.01190
          meta: LIGO–Virgo Collaboration, <em>Astrophys. J. Lett.</em> 900, L13
          note: I produced the main parameter estimation and analyzed ringdown and recoil.
        - year: 2019
          title: Tests of General Relativity with the Binary Black Hole Signals from the LIGO–Virgo Catalog GWTC-1
          url: https://arxiv.org/abs/1903.04467
          meta: LIGO–Virgo Collaboration, <em>Phys. Rev. D</em> 100, 104036
          note: I wrote several sections as part of the editorial team and contributed the polarizations analysis.
        - year: 2019
          title: Tests of General Relativity with GW170817
          url: https://arxiv.org/abs/1811.00364
          meta: LIGO–Virgo Collaboration, <em>Phys. Rev. Lett.</em> 123, 011102
          note: I carried out and wrote the polarization analysis.
        - year: 2018
          title: First search for nontensorial gravitational waves from known pulsars
          url: https://arxiv.org/abs/1709.09203
          meta: LIGO–Virgo Collaboration, <em>Phys. Rev. Lett.</em> 120, 031104
          note: "I was the lead author and analyst: performed the study and wrote the paper on behalf of the Collaborations."
        - year: 2017
          title: First narrow-band search for continuous gravitational waves from known pulsars in advanced detector data
          url: https://arxiv.org/abs/1710.02327
          meta: LIGO–Virgo Collaboration, <em>Phys. Rev. D</em> 96, 122006
          note: I contributed a coherence study of detection outliers.
        - year: 2017
          title: "GW170814: A Three-Detector Observation of Gravitational Waves from a Binary Black Hole Coalescence"
          url: https://arxiv.org/abs/1709.09660
          meta: LIGO–Virgo Collaboration, <em>Phys. Rev. Lett.</em> 119, 141101
          note: I contributed the polarization analysis and wrote the respective section.
    - title: LISA Consortium publications
      type: dated_list
      contents:
