# Curriculum vitae summary shown on /cv/.  The page deliberately covers only
# employment, education, publication rankings and advising; the full CV is the
# PDF in assets/pdf/, pushed by the GitHub Actions build of the private
# maxisi/cv repository (maxisi_cv.tex).
#
# Each top-level entry is a card.  Types (rendered by _layouts/cv.html):
#   time_table  entries with title / institution / location / year / maindescription / description (list) / linkitems
#   dated_list  compact rows: year, title (optionally with url), meta, note, tags (list)
#   grouped     contents is a list of groups {title, text, type, contents}, each rendered with its own type
#   text        Markdown paragraph(s) in `contents`
#   include     renders the include named in `include` (data-driven sections shared with other pages)
#   list / map / nested_list / list_groups  (al-folio defaults)

- title: Employment
  type: time_table
  contents:
    - title: Assistant Professor
      institution: Department of Astronomy, Columbia University
      year: 2025–
    - title: Associate Research Scientist
      institution: Center for Computational Astrophysics, Flatiron Institute
      year: 2025–
    - title: Flatiron Research Fellow
      institution: Center for Computational Astrophysics, Flatiron Institute
      year: 2021–2025
    - title: NASA Einstein Fellow
      institution: Massachusetts Institute of Technology
      year: 2019–2021

- title: Education
  type: time_table
  contents:
    - title: Ph.D. in Physics
      institution: California Institute of Technology
      location: Pasadena, CA
      year: 2019
      maindescription: "Thesis advisor: Alan J. Weinstein."
    - title: B.S. in Physics and Mathematics
      institution: Loyola Marymount University
      location: Los Angeles, CA
      year: 2014
      maindescription: "Thesis advisor: Jonas R. Mureika. Trustee Scholarship; <em>summa cum laude</em>."

- title: Publication rankings
