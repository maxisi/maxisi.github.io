- title: Research interests
  type: text
  contents: >
    Gravitational-wave astrophysics, with a focus on black holes. Bringing together all aspects of
    gravitational-wave science (detection, source modeling, inference, and astrophysics and physics
    theory) with inference and machine-learning techniques to carry out precision measurements with
    present and future detectors on the ground (LIGO, Cosmic Explorer) and in space (LISA).

