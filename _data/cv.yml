- title: Leadership and service
  type: time_table
  contents:
    - title: Scientific collaborations
      maindescription: >
        LIGO Scientific Collaboration (2012–present); LISA Consortium (2019–present).
        I have led or co-led multiple flagship LIGO–Virgo–KAGRA publications, including the detection of
        GW250114, the astrophysical implications of GWTC-5, and tests of general relativity with GWTC-2.
        As Paper Chair or Project Manager I have overseen the production of results and manuscripts,
        coordinating the work of dozens of collaboration members (see the collaboration papers below).
    - title: Journal and grant reviewer
      maindescription: >
        NASA and NSF grants. Journals: <em>Phys. Rev. Lett.</em>, <em>Phys. Rev. X</em>, <em>Phys. Rev. D</em>,
        <em>Rev. Mod. Phys.</em>, <em>Phys. Lett. B</em>, <em>Nature</em>, <em>Commun. Phys.</em>, <em>iScience</em>,
        <em>MNRAS</em>, <em>ApJ</em>, <em>ApJL</em>; guest editor for <em>PNAS</em>. Internal referee for 28 publications
        of the LIGO Scientific Collaboration, and reviewer of software for multiple analysis pipelines.
    - title: Seminar and workshop organizer
      description:
        - Gravitational waves study hub, Columbia University (2026)
        - Black-hole Ringdowns at CCA, Flatiron Institute (2022)
        - LIGO Open Data Workshop, Flatiron Institute (2022)
        - Pacific Coast Gravity Meeting (PCGM), Caltech (2018)
        - Caltech/JPL Association for Gravitational-Wave Research, monthly seminars (2015–2018)
    - title: Columbia University service
      description:
        - Graduate Admissions Committee (2025)
        - Astrostatistics Major Design Committee (2025–present)
        - Thesis committees for Chengcheng Xin, Justin Vega and John Staunton
        - Columbia AI Verticals Project

